# Static site: no build step. Netlify serves the repository root as-is.
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"

# Code changes often during development; art rarely does.
[[headers]]
  for = "/src/*"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/Artwork/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
